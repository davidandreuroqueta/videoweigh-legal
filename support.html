<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Soporte - VideoWeigh</title>
  <link rel="icon" type="image/png" href="./favicon.png">
  <link rel="stylesheet" href="./styles.css">
  <style>
    .support-btn {
      width: auto;
      padding-left: 24px;
      padding-right: 24px;
    }
  </style>
</head>
<body class="gradient-bg centered">
  <div class="glass-container container">
    <h1 class="h3 text-center mb-md">Soporte VideoWeigh</h1>
    <p class="text-secondary text-center mb-xl">
      Estamos abriendo tu correo para escribir a soporte.
    </p>
    <div class="text-center">
      <a class="btn btn-primary support-btn" href="mailto:soporte@videoweigh.com">
        Enviar correo a soporte@videoweigh.com
      </a>
    </div>
    <p class="text-caption text-secondary text-center mt-lg">
      Si no se abre tu app de correo, escribe a soporte@videoweigh.com
    </p>
  </div>

  <script>
    setTimeout(function() {
      window.location.href = 'mailto:soporte@videoweigh.com';
    }, 300);
  </script>
</body>
</html>
